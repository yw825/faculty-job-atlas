# Posts each daily health report (job-data/health/report.md, written by
# health_report.py and pushed by the refresh) as an issue. The issue is opened
# by github-actions[bot], not the owner, so GitHub emails it to the owner --
# it does not notify people about their own activity. Yesterday's report
# issue is closed so only the latest stays open.
name: health report

on:
  push:
    branches: [main]
    paths: [job-data/health/report.md]
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: job-data/health
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('job-data/health/report.md', 'utf8').slice(0, 60000);
            const first = body.split('\n')[0].replace(/^#\s*/, '');
            const m = body.match(/\*\*(\d+) items need a look/);
            const title = `${first}: ${m ? m[1] + ' items need a look' : 'all clear'}`;
            const label = 'health-report';
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch {
              await github.rest.issues.createLabel({ ...context.repo, name: label, color: '0e8a16' });
            }
            const open = await github.paginate(github.rest.issues.listForRepo,
              { ...context.repo, state: 'open', labels: label });
            for (const issue of open) {
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed' });
            }
            await github.rest.issues.create({ ...context.repo, title, body, labels: [label] });
